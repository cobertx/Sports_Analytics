[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sports-analytics"
version = "0.1.0"
description = "Historical NBA, NFL, and NCAAF statistics and forecasting workspace"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements/requirements.txt"]}

[tool.setuptools.packages.find]
include = ["app", "app.*", "sports_analytics*", "models*"]

[tool.setuptools.package-data]
app = ["assets/css/*.css", "assets/js/*.js", "assets/providers/*", "assets/leagues/*.png", "images/*/Team Logos/*.png", "images/*/Team Logos/*.json", "docs/*.md"]
"models" = ["*.md"]
"models.Game_Outcome" = ["*.md"]
"models.Player_Stats" = ["*.md"]
"models.Player_Stats.Weighted_Historical_Performance" = ["*.md", "*.pdf"]
"models.Player_Stats.Usage_Opportunity" = ["*.md", "*.pdf"]
"models.Player_Stats.Opponent_Adjusted_Matchup" = ["*.md", "*.pdf"]
"models.Player_Stats.Pace_Game_Environment" = ["*.md", "*.pdf"]
"models.Player_Stats.Playing_Time_Rotation" = ["*.md"]
"models.Player_Stats.Injury_Lineup_Adjusted" = ["*.md"]
"models.Game_Outcome.PPP" = ["*.md", "*.pdf"]
"models.Game_Outcome.EPA" = ["*.md", "*.pdf"]
"models.Game_Outcome.ELO" = ["*.md", "*.pdf"]
