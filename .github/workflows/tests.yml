name: Python checks

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/requirements.txt
      - name: Verify tracked paths before installation
        run: python scripts/check_project.py --layout-only
      - name: Install project and runtime dependencies
        run: python -m pip install .
      - run: python -m pip check
      - name: Compile application and models
        run: python -m compileall -q app.py index.py sports_analytics models scripts
      - name: Check project layout, imports and dashboard
        run: python scripts/check_project.py
      - name: Check backtesting equivalence and cache isolation
        run: python scripts/check_backtesting.py
      - name: Check research settings and experiment replay
        run: python scripts/check_research.py
      - name: Check market links and relevant historical statistics
        run: python scripts/check_market_history.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check market return navigation events
        run: node scripts/check_market_navigation.js
      - name: Check mispricing ranking and market filter controls
        run: python scripts/check_mispricing.py
      - name: Check research methodology comparisons and shared cohorts
        run: python scripts/check_comparisons.py
      - name: Check recorded in-game coordinates, indexing and navigation
        run: python scripts/check_in_game.py
      - name: Check cache refresh isolation and equivalent filtering
        run: python scripts/check_performance.py
