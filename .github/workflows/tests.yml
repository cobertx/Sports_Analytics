name: Python checks

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/requirements.txt
      - name: Verify tracked paths before installation
        run: python scripts/check_project.py --layout-only
      - name: Install project and runtime dependencies
        run: python -m pip install .
      - run: python -m pip check
      - name: Compile application and models
        run: python -m compileall -q app.py index.py sports_analytics models scripts
      - name: Check project layout, imports and dashboard
        run: python scripts/check_project.py
      - name: Check backtesting equivalence and cache isolation
        run: python scripts/check_backtesting.py
      - name: Check simultaneous player backtests and live filtering
        run: python scripts/check_backtest_concurrency.py
      - name: Check sport backtest summaries and saved result reopening
        run: python scripts/check_backtesting_summary.py
      - name: Check sport performance summaries and missing simulations
        run: python scripts/check_performance_summary.py
      - name: Check research settings and experiment replay
        run: python scripts/check_research.py
      - name: Check current-season model weighting and historical cutoffs
        run: python scripts/check_season_weights.py
      - name: Check market links and relevant historical statistics
        run: python scripts/check_market_history.py
      - name: Check prompt history thresholds and observed hit counts
        run: python scripts/check_prompt_history.py
      - name: Check current-season NBA history and single-game market links
        run: python scripts/check_nba_history.py
      - name: Check nullable NBA inputs, returning players and forecast availability
        run: python scripts/check_nba_market_forecasts.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check market return navigation events
        run: node scripts/check_market_navigation.js
      - name: Check native exchange panel toggles
        run: node scripts/check_exchange_panels.js
      - name: Check immediate market transitions
        run: node scripts/check_market_transitions.js
      - name: Check mispricing ranking and market filter controls
        run: python scripts/check_mispricing.py
      - name: Check saved Quick Filtering results, sport navigation and ordering
        run: python scripts/check_filtered_results.py
      - name: Check research methodology comparisons and shared cohorts
        run: python scripts/check_comparisons.py
      - name: Check recorded in-game coordinates, indexing and navigation
        run: python scripts/check_in_game.py
      - name: Check cache refresh isolation and equivalent filtering
        run: python scripts/check_performance.py
      - name: Check immediate local reads and nonblocking background refreshes
        run: python scripts/check_loading_speed.py
      - name: Check nonblocking game entry, local quote views and forecast equivalence
        run: python scripts/check_page_speed.py
      - name: Check information sources, local news and weather freshness
        run: python scripts/check_information.py
      - name: Check personal P&L ledger and statement imports
        run: python scripts/check_pnl.py
      - name: Check public Kalshi markets, polling and saved snapshots
        run: python scripts/check_kalshi.py
      - name: Check incremental exchange updates and nonblocking quote reads
        run: python scripts/check_exchange_updates.py
      - name: Check Kalshi probability comparison and mispricing filters
        run: python scripts/check_kalshi_analysis.py
      - name: Check retained market views and navigation cache scope
        run: python scripts/check_market_transitions.py
      - name: Check public Polymarket discovery, order books and snapshots
        run: python scripts/check_polymarket.py
      - name: Check combined market summary, matching and forecast settlement
        run: python scripts/check_market_summary.py
      - name: Check cross-provider market structure and activity accounting
        run: python scripts/check_market_structure.py
      - name: Check market structure dialog keyboard support syntax
        run: node --check sports_analytics/assets/market_structure.js
