name: Python checks

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/requirements.txt
      - name: Verify tracked paths before installation
        run: python scripts/check_project.py --layout-only
      - name: Install project and runtime dependencies
        run: python -m pip install .
      - run: python -m pip check
      - name: Compile application and models
        run: python -m compileall -q app.py index.py sports_analytics models scripts
      - name: Check project layout, imports and dashboard
        run: python scripts/check_project.py
